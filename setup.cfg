[metadata]
name = vmcnet
version = 0.1.0
description = NucleoNet: a nuclear-aware determinant ansatz for multi-geometry neural VMC.
long_description = file: README.md
long_description_content_type = text/markdown
author = NucleoNet authors
url = https://github.com/Qiao395369/NucleoNet
license = MIT AND Apache-2.0
license_files =
    LICENSE
    LICENSES/Apache-2.0.txt
    THIRD_PARTY_NOTICES.md
platforms = unix, linux, macos
classifiers =
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3.10

[options]
packages = find:
# Direct runtime dependencies pinned to vmcnet_env_python3.10 (Python 3.10.18).
# This is not a complete lockfile for the Conda environment or CUDA libraries.
install_requires =
    absl-py==2.3.1
    attrs==25.3.0
    chex==0.1.90
    dm-haiku==0.0.15
    jax==0.4.34
    jaxlib==0.4.34
    flax==0.10.2
    optax==0.2.4
    numpy==1.26.4
    ml-collections==1.0.0
    pyscf==2.10.0
    scipy==1.15.3
    typing-extensions==4.14.1
# Restrict installation to the Python minor version used by this environment.
python_requires = >=3.10,<3.11
zip_safe = no

[options.packages.find]
include =
    vmcnet
    vmcnet.*

[options.entry_points]
console_scripts =
    vmc-molecule = vmcnet.train.runners:run_molecule
    vmc-statistics = vmcnet.train.do_statistic:vmc_statistics

[options.extras_require]
testing =
    pytest==9.0.2
cuda12 =
    jax[cuda12]==0.4.34

[flake8]
max-line-length = 88
select = C,E,F,W,B,B950
ignore = E203,W503
per-file-ignores = __init__.py:F401
